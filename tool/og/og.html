<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("../../src/fonts/fraunces-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Inter";
        src: url("../../src/fonts/inter-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #fbf8f3;
        color: #211c16;
        font-family: Inter, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px 90px;
      }
      .wash {
        position: absolute;
        right: -220px;
        top: -220px;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(178, 94, 56, 0.1), transparent);
      }
      h1 {
        font-family: Fraunces, serif;
        font-size: 84px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.06;
        max-width: 850px;
      }
      .brandrow {
        display: flex;
        align-items: center;
        gap: 28px;
        margin-bottom: 46px;
      }
      .brandname {
        font-family: Fraunces, serif;
        font-size: 44px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .sub {
        margin-top: 28px;
        font-size: 27px;
        color: #6b6254;
        line-height: 1.5;
        max-width: 780px;
      }
      .footer {
        position: absolute;
        bottom: 52px;
        left: 96px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
        color: #9e4b28;
        font-weight: 500;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #9e4b28;
      }
    </style>
  </head>
  <body>
    <div class="wash"></div>
    <div class="brandrow">
      <svg
        style="
          width: 148px;
          height: 148px;
          border-radius: 32px;
          box-shadow: 0 24px 60px -20px rgba(158, 75, 40, 0.45);
        "
        xmlns="http://www.w3.org/2000/svg"
        width="1024"
        height="1024"
        viewBox="0 0 1024 1024"
      >
        <rect width="1024" height="1024" rx="224.0" fill="#9E4B28" />
        <path
          d="M383.35 753.71C718.71 824.44 788.59 409.74 680.66 194.56C456.07 225.76 165.50 515.95 383.35 753.71ZM392.27 736.93L603.36 339.94M383.35 753.71C360.61 796.48 313.84 814.29 296.47 829.44"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="32.93"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="brandname">Umberleaf</span>
    </div>
    <h1>A quieter home for the written word.</h1>
    <p class="sub">
      A focused editor, a craft-first companion, and readers who actually read. Coming soon.
    </p>
    <p class="footer">
      <span>umberleaf.com</span><span class="dot"></span><span>Join the waitlist</span>
    </p>
  </body>
</html>
